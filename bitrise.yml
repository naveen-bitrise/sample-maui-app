format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

# Default stack for anything that does not override it. Each workflow below
# pins the stack it actually needs.
meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: standard

app:
  envs:
  # ---- Project layout -------------------------------------------------------
  - APP_PROJECT: src/SampleMauiApp/SampleMauiApp.csproj
  - UNIT_TEST_PROJECT: tests/SampleMauiApp.UnitTests/SampleMauiApp.UnitTests.csproj
  - UI_TEST_PROJECT: tests/SampleMauiApp.UITests/SampleMauiApp.UITests.csproj
  - APP_ID: io.bitrise.mauiapp

  # ---- Toolchain ------------------------------------------------------------
  # MAUI has no first-party Bitrise Step, so the SDK is installed with
  # Microsoft's official dotnet-install.sh and cached between builds.
  - DOTNET_CHANNEL: "10.0"
  - IOS_TFM: net10.0-ios
  - ANDROID_TFM: net10.0-android

  # Keep the .NET CLI quiet and non-interactive on CI.
  - DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  - DOTNET_NOLOGO: "1"
  - DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

# Pipelines let the iOS and Android UI tests run at the same time on the
# stacks each one actually needs (Android emulators cannot run on the
# Apple Silicon macOS machines, so they must go to Linux).
pipelines:
  ui_tests:
    workflows:
      ui_tests_ios: {}
      ui_tests_android: {}

step_bundles:
  # Installs the .NET SDK and puts it on PATH for every later Step.
  install_dotnet:
    steps:
    - restore-cache@2:
        title: Restore .NET SDK cache
        inputs:
        - key: dotnet-sdk-{{ .OS }}-{{ .Arch }}-$DOTNET_CHANNEL
    - script@1:
        title: Install .NET SDK
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            export DOTNET_ROOT="$HOME/.dotnet"

            if [ ! -x "$DOTNET_ROOT/dotnet" ]; then
              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$DOTNET_ROOT"
            fi

            envman add --key DOTNET_ROOT --value "$DOTNET_ROOT"
            envman add --key PATH --value "$DOTNET_ROOT:$PATH"

            "$DOTNET_ROOT/dotnet" --version

  # NuGet packages change far less often than the SDK, so they get their own cache.
  restore_nuget:
    steps:
    - restore-cache@2:
        title: Restore NuGet cache
        inputs:
        - key: nuget-{{ .OS }}-{{ .Arch }}-{{ checksum "**/*.csproj" }}

  save_caches:
    steps:
    - save-cache@1:
        title: Save .NET SDK cache
        is_always_run: true
        inputs:
        - key: dotnet-sdk-{{ .OS }}-{{ .Arch }}-$DOTNET_CHANNEL
        - paths: $HOME/.dotnet
    - save-cache@1:
        title: Save NuGet cache
        is_always_run: true
        inputs:
        - key: nuget-{{ .OS }}-{{ .Arch }}-{{ checksum "**/*.csproj" }}
        - paths: $HOME/.nuget/packages

  # Resolves code signing and publishes a signed .ipa. The calling workflow sets
  # DISTRIBUTION_TYPE to app-store or ad-hoc; everything else is identical, so
  # the two iOS release workflows share this.
  sign_and_publish_ipa:
    steps:
    - script@1:
        title: Resolve code signing
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            # Discover the identity and profile instead of hardcoding names, and
            # fail with a specific diagnosis when what is uploaded is the wrong
            # kind. Otherwise a mismatched profile surfaces much later as an
            # opaque codesign error, after minutes of build time.
            python3 - <<'PYEOF' > /tmp/signing.env
            import glob, os, plistlib, re, subprocess

            bundle_id = os.environ["APP_ID"]
            wanted = os.environ["DISTRIBUTION_TYPE"]

            identities = re.findall(
                r'"([^"]+)"',
                subprocess.run(["security", "find-identity", "-v", "-p", "codesigning"],
                               capture_output=True, text=True).stdout,
            )
            # Both app-store and ad-hoc distribution sign with a distribution
            # certificate; only development builds use a development one.
            distribution = [i for i in identities
                            if i.startswith(("Apple Distribution", "iPhone Distribution"))]
            if not distribution:
                raise SystemExit(
                    "No Apple/iPhone Distribution identity found in the keychain.\n"
                    "Identities present: " + (", ".join(identities) or "none") + "\n"
                    f"A {wanted!r} build needs a distribution certificate, not a development one."
                )

            def classify(profile):
                """Which distribution channel a .mobileprovision is for."""
                if profile.get("ProvisionsAllDevices"):
                    return "enterprise"
                if "ProvisionedDevices" in profile:
                    # Development profiles allow debugging; ad-hoc ones do not.
                    if profile.get("Entitlements", {}).get("get-task-allow"):
                        return "development"
                    return "ad-hoc"
                return "app-store"

            def read_profile(path):
                xml = subprocess.run(["security", "cms", "-D", "-i", path],
                                     capture_output=True).stdout
                return plistlib.loads(xml)

            exact, wildcard, rejected = [], [], []
            pattern = os.path.expanduser(
                "~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision")
            for path in glob.glob(pattern):
                profile = read_profile(path)
                app_id = profile.get("Entitlements", {}).get("application-identifier", "")
                kind = classify(profile)
                label = f'{profile.get("Name")!r} [type={kind}, app-id={app_id}]'
                if kind != wanted:
                    rejected.append(label)
                elif app_id.endswith("." + bundle_id):
                    exact.append((profile, label))
                elif app_id.endswith(".*"):
                    wildcard.append((profile, label))
                else:
                    rejected.append(label)

            # Prefer a profile pinned to this bundle id over a wildcard one.
            candidates = exact + wildcard
            if not candidates:
                raise SystemExit(
                    f"No {wanted} provisioning profile matching {bundle_id}.\n"
                    "Profiles installed: " + ("; ".join(rejected) or "none") + "\n"
                    f"Upload a profile of type {wanted!r} for this bundle id, or run "
                    "the workflow that matches the profile you have."
                )

            profile, label = candidates[0]
            devices = profile.get("ProvisionedDevices") or []
            print(f'CODESIGN_IDENTITY="{distribution[0]}"')
            print(f'PROVISION_UUID="{profile["UUID"]}"')
            print(f'PROVISION_LABEL={label!r}')
            print(f'PROVISION_DEVICE_COUNT="{len(devices)}"')
            PYEOF

            source /tmp/signing.env

            envman add --key CODESIGN_IDENTITY --value "$CODESIGN_IDENTITY"
            envman add --key PROVISION_UUID --value "$PROVISION_UUID"

            echo "Distribution: $DISTRIBUTION_TYPE"
            echo "Identity:     $CODESIGN_IDENTITY"
            echo "Profile:      $PROVISION_LABEL"

            if [ "$DISTRIBUTION_TYPE" = "ad-hoc" ]; then
              # An ad-hoc build only installs on devices listed in the profile,
              # so an empty list means the .ipa is useless before anyone tries it.
              echo "Devices:      $PROVISION_DEVICE_COUNT registered"
              if [ "$PROVISION_DEVICE_COUNT" = "0" ]; then
                echo "This ad-hoc profile has no registered devices - the .ipa will not install anywhere." >&2
                exit 1
              fi
            fi
    - script@1:
        title: Publish signed .ipa
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet workload install maui-ios --skip-sign-check

            # ArchiveOnBuild makes dotnet publish produce the .xcarchive and .ipa.
            # The provisioning profile decides the distribution channel, so the
            # same command serves app-store and ad-hoc.
            # ApplicationVersion is CFBundleVersion: App Store Connect rejects a
            # rebuild that reuses a build number, so it tracks the Bitrise build.
            dotnet publish "$APP_PROJECT" \
              -p:BuildPlatform=ios \
              --framework "$IOS_TFM" \
              --configuration Release \
              -p:RuntimeIdentifier=ios-arm64 \
              -p:ArchiveOnBuild=true \
              -p:CodesignKey="$CODESIGN_IDENTITY" \
              -p:CodesignProvision="$PROVISION_UUID" \
              -p:ApplicationVersion="$BITRISE_BUILD_NUMBER"

            ipa="$(find "$BITRISE_SOURCE_DIR/src/SampleMauiApp/bin/Release/$IOS_TFM" -name '*.ipa' | head -1)"
            test -n "$ipa"

            cp "$ipa" "$BITRISE_DEPLOY_DIR/"
            envman add --key BITRISE_IPA_PATH --value "$ipa"

            echo "Built $(basename "$ipa") ($DISTRIBUTION_TYPE)"

  # Boots an Appium server in the background and waits for it to accept connections.
  start_appium:
    steps:
    - script@1:
        title: Install and start Appium
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            npm install -g appium@3
            appium driver install "$APPIUM_DRIVER" || true

            appium server --port 4723 --log "$BITRISE_DEPLOY_DIR/appium.log" --log-level info &

            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium is up"
                exit 0
              fi
              sleep 2
            done

            echo "Appium did not become ready in time" >&2
            exit 1

workflows:
# ---------------------------------------------------------------------------
# Unit tests - pure C#, no device or emulator needed, so this runs on Linux.
# ---------------------------------------------------------------------------
  unit_tests:
    summary: Run the xUnit tests against the platform-independent core library.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: standard
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - script@1:
        title: dotnet test (unit)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet test "$UNIT_TEST_PROJECT" \
              --configuration Release \
              --logger "junit;LogFilePath=$BITRISE_SOURCE_DIR/test-results/unit-tests.xml"
    - script@1:
        title: Collect test results
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            result_dir="$BITRISE_TEST_RESULT_DIR/unit-tests"
            mkdir -p "$result_dir"
            cp "$BITRISE_SOURCE_DIR/test-results/unit-tests.xml" "$result_dir/" 2>/dev/null || true
            echo '{"test-name":"Unit tests"}' > "$result_dir/test-info.json"
    - bundle::save_caches: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true

# ---------------------------------------------------------------------------
# iOS: build an unsigned .app that runs on a simulator.
# ---------------------------------------------------------------------------
  build_simulator:
    summary: Build the iOS app for the simulator and export the .app bundle.
    meta:
      bitrise.io:
        stack: osx-xcode-26.6.x
        machine_type_id: g2-m1.4core
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - script@1:
        title: Build iOS simulator app
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet workload install maui-ios --skip-sign-check

            # iossimulator-arm64 matches Bitrise's Apple Silicon machines.
            # BuildPlatform narrows the project to a single TargetFramework.
            # Without it, dotnet's implicit restore evaluates every entry in
            # TargetFrameworks and demands the android workload too (NETSDK1147).
            dotnet build "$APP_PROJECT" \
              -p:BuildPlatform=ios \
              --framework "$IOS_TFM" \
              --configuration Debug \
              -p:RuntimeIdentifier=iossimulator-arm64

            app_path="$(find "$BITRISE_SOURCE_DIR/src/SampleMauiApp/bin/Debug/$IOS_TFM/iossimulator-arm64" -maxdepth 1 -name '*.app' | head -1)"
            test -n "$app_path"

            # .app is a directory, so it has to be zipped to survive as an artifact.
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "$BITRISE_DEPLOY_DIR/SampleMauiApp-simulator.zip"

            envman add --key BITRISE_APP_DIR_PATH --value "$app_path"
    - bundle::save_caches: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true

# ---------------------------------------------------------------------------
# iOS release builds. Both sign with the certificate and provisioning profile
# uploaded to the app's Code Signing tab, and differ only in which profile
# they require. MAUI has no .xcodeproj, so the newer manage-ios-code-signing
# Step (which reads one) is not usable here - certificate-and-profile-installer
# just installs what is uploaded, which is all dotnet publish needs.
# ---------------------------------------------------------------------------
  build_appstore:
    summary: Build a signed .ipa for App Store submission.
    meta:
      bitrise.io:
        stack: osx-xcode-26.6.x
        machine_type_id: g2-m1.4core
    envs:
    - DISTRIBUTION_TYPE: app-store
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - certificate-and-profile-installer@1: {}
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - bundle::sign_and_publish_ipa: {}
    - bundle::save_caches: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true

  build_adhoc:
    summary: Build a signed .ipa for ad-hoc distribution to registered devices.
    meta:
      bitrise.io:
        stack: osx-xcode-26.6.x
        machine_type_id: g2-m1.4core
    envs:
    - DISTRIBUTION_TYPE: ad-hoc
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - certificate-and-profile-installer@1: {}
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - bundle::sign_and_publish_ipa: {}
    - bundle::save_caches: {}
    # deploy-to-bitrise-io publishes a public install page for the .ipa by
    # default, which is how testers on the profile's device list install it.
    - deploy-to-bitrise-io@2:
        is_always_run: true

# ---------------------------------------------------------------------------
# Android: build a debug APK that runs on an emulator (and real devices).
# ---------------------------------------------------------------------------
  build_emulator:
    summary: Build a debug APK that installs on an Android emulator.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: standard
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - script@1:
        title: Build Android APK
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet workload install maui-android --skip-sign-check

            # The APK ships arm64-v8a + x86_64, so the same artifact runs on
            # Linux (x86_64) and Apple Silicon emulators.
            # See the iOS note: restore evaluates every TargetFrameworks entry,
            # so this must be narrowed or the build demands the ios workload.
            # (On Linux the csproj already excludes iOS, but being explicit
            # keeps this workflow runnable on a macOS stack too.)
            dotnet build "$APP_PROJECT" \
              -p:BuildPlatform=android \
              --framework "$ANDROID_TFM" \
              --configuration Debug

            apk="$(find "$BITRISE_SOURCE_DIR/src/SampleMauiApp/bin/Debug/$ANDROID_TFM" -maxdepth 1 -name '*-Signed.apk' | head -1)"
            test -n "$apk"

            cp "$apk" "$BITRISE_DEPLOY_DIR/"
            envman add --key BITRISE_APK_PATH --value "$apk"
    - bundle::save_caches: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true

# ---------------------------------------------------------------------------
# UI tests - iOS simulator. Driven by Appium's XCUITest driver.
# ---------------------------------------------------------------------------
  ui_tests_ios:
    summary: Run the Appium UI tests against an iOS simulator.
    meta:
      bitrise.io:
        stack: osx-xcode-26.6.x
        machine_type_id: g2-m1.4core
    envs:
    - APPIUM_DRIVER: xcuitest
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - script@1:
        title: Build iOS simulator app
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet workload install maui-ios --skip-sign-check

            # BuildPlatform narrows the project to a single TargetFramework.
            # Without it, dotnet's implicit restore evaluates every entry in
            # TargetFrameworks and demands the android workload too (NETSDK1147).
            dotnet build "$APP_PROJECT" \
              -p:BuildPlatform=ios \
              --framework "$IOS_TFM" \
              --configuration Debug \
              -p:RuntimeIdentifier=iossimulator-arm64

            app_path="$(find "$BITRISE_SOURCE_DIR/src/SampleMauiApp/bin/Debug/$IOS_TFM/iossimulator-arm64" -maxdepth 1 -name '*.app' | head -1)"
            test -n "$app_path"
            envman add --key UITEST_APP_PATH --value "$app_path"
    - script@1:
        title: Boot an iOS simulator
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            # Pick whatever recent iPhone the stack actually ships rather than
            # pinning a model name that may disappear on the next Xcode bump.
            xcrun simctl list devices available --json > /tmp/simulators.json

            python3 - <<'PYEOF' > /tmp/simulator.env
            import json

            with open("/tmp/simulators.json") as handle:
                devices = json.load(handle)["devices"]

            def ios_version(runtime):
                """'...SimRuntime.iOS-26-5' -> (26, 5); non-iOS runtimes sort last."""
                if "iOS-" not in runtime:
                    return None
                parts = runtime.rsplit("iOS-", 1)[-1].split("-")
                return tuple(int(part) for part in parts if part.isdigit())

            candidates = [r for r in devices if ios_version(r)]
            if not candidates:
                raise SystemExit("No iOS runtime found on this stack")

            for runtime in sorted(candidates, key=ios_version, reverse=True):
                for device in devices[runtime]:
                    if device["name"].startswith("iPhone"):
                        version = ".".join(str(n) for n in ios_version(runtime))
                        # Quoted: simulator names contain spaces.
                        print(f'UDID="{device["udid"]}"')
                        print(f'NAME="{device["name"]}"')
                        print(f'VERSION="{version}"')
                        raise SystemExit(0)

            raise SystemExit("No iPhone simulator found on this stack")
            PYEOF

            source /tmp/simulator.env

            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b

            envman add --key UITEST_PLATFORM --value ios
            envman add --key UITEST_UDID --value "$UDID"
            envman add --key UITEST_DEVICE_NAME --value "$NAME"
            envman add --key UITEST_PLATFORM_VERSION --value "$VERSION"

            echo "Booted $NAME ($VERSION) - $UDID"
    - bundle::start_appium: {}
    - script@1:
        title: dotnet test (UI, iOS)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet test "$UI_TEST_PROJECT" \
              --logger "junit;LogFilePath=$BITRISE_SOURCE_DIR/test-results/ui-tests-ios.xml"
    - script@1:
        title: Collect test results
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            result_dir="$BITRISE_TEST_RESULT_DIR/ui-tests-ios"
            mkdir -p "$result_dir"
            cp "$BITRISE_SOURCE_DIR/test-results/ui-tests-ios.xml" "$result_dir/" 2>/dev/null || true
            echo '{"test-name":"UI tests (iOS)"}' > "$result_dir/test-info.json"
    - bundle::save_caches: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true

# ---------------------------------------------------------------------------
# UI tests - Android emulator. Must run on Linux: Android emulators cannot
# run on Bitrise's Apple Silicon machines.
# ---------------------------------------------------------------------------
  ui_tests_android:
    summary: Run the Appium UI tests against an Android emulator.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: elite-xl
    envs:
    - APPIUM_DRIVER: uiautomator2
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - avd-manager@2:
        title: Start Android emulator
        inputs:
        - api_level: "35"
        - profile: pixel_6
        - tag: google_apis
    - bundle::install_dotnet: {}
    - bundle::restore_nuget: {}
    - script@1:
        title: Build Android APK
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet workload install maui-android --skip-sign-check

            # See the iOS note: restore evaluates every TargetFrameworks entry,
            # so this must be narrowed or the build demands the ios workload.
            # (On Linux the csproj already excludes iOS, but being explicit
            # keeps this workflow runnable on a macOS stack too.)
            dotnet build "$APP_PROJECT" \
              -p:BuildPlatform=android \
              --framework "$ANDROID_TFM" \
              --configuration Debug

            apk="$(find "$BITRISE_SOURCE_DIR/src/SampleMauiApp/bin/Debug/$ANDROID_TFM" -maxdepth 1 -name '*-Signed.apk' | head -1)"
            test -n "$apk"

            envman add --key UITEST_PLATFORM --value android
            envman add --key UITEST_APP_PATH --value "$apk"
            envman add --key UITEST_DEVICE_NAME --value "$BITRISE_EMULATOR_SERIAL"
            envman add --key UITEST_UDID --value "$BITRISE_EMULATOR_SERIAL"
    - wait-for-android-emulator@1:
        inputs:
        - boot_timeout: "600"
    - bundle::start_appium: {}
    - script@1:
        title: dotnet test (UI, Android)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            dotnet test "$UI_TEST_PROJECT" \
              --logger "junit;LogFilePath=$BITRISE_SOURCE_DIR/test-results/ui-tests-android.xml"
    - script@1:
        title: Collect test results
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            result_dir="$BITRISE_TEST_RESULT_DIR/ui-tests-android"
            mkdir -p "$result_dir"
            cp "$BITRISE_SOURCE_DIR/test-results/ui-tests-android.xml" "$result_dir/" 2>/dev/null || true
            echo '{"test-name":"UI tests (Android)"}' > "$result_dir/test-info.json"
    - bundle::save_caches: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true

trigger_map:
- push_branch: main
  workflow: unit_tests
- pull_request_source_branch: "*"
  workflow: unit_tests
